services:
  # ── Backend API (Python/FastAPI) ──────────────────────────────────────────
  - type: web
    name: sentinelnexus-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && alembic upgrade head
    startCommand: cd backend && gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelnexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sentinelnexus-cache
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.vercel.app,sentinelnexus.mayyanks.app,www.sentinelnexus.mayyanks.app,*.clerk.accounts.dev"
      - key: ALLOWED_ORIGINS
        value: '["https://sentinelnexus.vercel.app", "https://www.sentinelnexus.vercel.app", "https://sentinelnexus.mayyanks.app", "https://*.clerk.accounts.dev"]'
      - key: FRONTEND_BASE_URL
        value: https://sentinelnexus.vercel.app
      - key: BACKEND_BASE_URL
        value: https://sentinelnexus-backend.onrender.com
      - key: CLERK_SECRET_KEY
        value: {{CLERK_SECRET_KEY}}
      - key: CLERK_JWKS_URL
        value: {{CLERK_JWKS_URL}}
      - key: CLERK_ISSUER
        value: {{CLERK_ISSUER}}
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "100"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"

  # ── Frontend (Next.js) ──────────────────────────────────────────────────
  - type: web
    name: sentinelnexus-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: sentinelnexus-backend
          property: url
        path: /api/v1
      - key: BACKEND_URL
        fromService:
          type: web
          name: sentinelnexus-backend
          property: url
      - key: NEXT_PUBLIC_SITE_URL
        value: https://sentinelnexus.vercel.app
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        value: {{NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}}
      - key: CLERK_SECRET_KEY
        value: {{CLERK_SECRET_KEY}}

databases:
  - name: sentinelnexus-db
    plan: standard
    postgresMajorVersion: "15"

# ── Managed Redis ───────────────────────────────────────────────────────────
redis:
  - name: sentinelnexus-cache
    plan: standard
    ipAllowList: [] # Only allow internal connections
