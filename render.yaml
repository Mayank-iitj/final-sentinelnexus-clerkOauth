services:
  # ── Backend API (Python/FastAPI) ──────────────────────────────────────────
  - type: web
    name: sentinelnexus-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && alembic upgrade head
    startCommand: cd backend && gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelnexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sentinelnexus-cache
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.vercel.app,sentinelnexus.mayyanks.app,www.sentinelnexus.mayyanks.app,*.clerk.accounts.dev"
      - key: ALLOWED_ORIGINS
        value: '["https://sentinelnexus.vercel.app", "https://www.sentinelnexus.vercel.app", "https://sentinelnexus.mayyanks.app", "https://*.clerk.accounts.dev"]'
      - key: FRONTEND_BASE_URL
        value: https://sentinelnexus.vercel.app
      - key: BACKEND_BASE_URL
        value: https://sentinelnexus-backend.onrender.com
      - key: CLERK_SECRET_KEY
        value: {{CLERK_SECRET_KEY}}
      - key: CLERK_JWKS_URL
        value: {{CLERK_JWKS_URL}}
      - key: CLERK_ISSUER
        value: {{CLERK_ISSUER}}
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "100"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: CLERK_WEBHOOK_SECRET
        value: {{CLERK_WEBHOOK_SECRET}}
      - key: PAYU_MERCHANT_KEY
        value: "JiZpKZ"
      - key: PAYU_MERCHANT_SALT
        value: "z0Meu5m4fu1MtiiJjuqGrMuKeTSCwled"
      - key: PAYU_CLIENT_ID
        value: "33a612192e8896f6587557b3051e582559cba64c1898a2e813442c7b9b9ca472"
      - key: PAYU_CLIENT_SECRET
        value: "633a3cfe4607854321a12199b3acd42bb7beb25005c91c1db30b2ed37183a78b"
      - key: PAYU_BASE_URL
        value: "https://test.payu.in/_payment"

      # ── Security Middleware (Production Engine) ─────────────────────────────
      # AUTOMATED BLOCKING ENABLED — per explicit user instruction.
      # Requests scoring ≥ SECURITY_BLOCK_SCORE_THRESHOLD are blocked (HTTP 400).
      - key: SECURITY_SHADOW_MODE
        value: "false"
      # Fail-open: middleware errors pass through rather than 500 the request.
      - key: SECURITY_FAIL_OPEN
        value: "true"
      # Max body bytes inspected (remainder forwarded uninspected, never dropped)
      - key: SECURITY_MAX_BODY_BYTES
        value: "65536"
      # Paths that bypass middleware entirely
      - key: SECURITY_SKIP_PATHS
        value: "/health,/metrics,/"
      # Score (0-100) at which the request is blocked
      - key: SECURITY_BLOCK_SCORE_THRESHOLD
        value: "80"
      # Score at which a warning is logged (no block)
      - key: SECURITY_WARN_SCORE_THRESHOLD
        value: "50"
      # Attacks before an IP is auto-banned
      - key: SECURITY_AUTO_BAN_THRESHOLD
        value: "3"
      # Sliding window for attack counting (seconds)
      - key: SECURITY_BAN_WINDOW_SECONDS
        value: "3600"
      # Duration of IP ban (seconds)
      - key: SECURITY_BAN_TTL_SECONDS
        value: "3600"

  # ── Frontend (Next.js) ──────────────────────────────────────────────────
  - type: web
    name: sentinelnexus-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: sentinelnexus-backend
          property: url
        path: /api/v1
      - key: BACKEND_URL
        fromService:
          type: web
          name: sentinelnexus-backend
          property: url
      - key: NEXT_PUBLIC_SITE_URL
        value: https://sentinelnexus.vercel.app
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        value: {{NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}}
      - key: CLERK_SECRET_KEY
        value: {{CLERK_SECRET_KEY}}

databases:
  - name: sentinelnexus-db
    plan: standard
    postgresMajorVersion: "15"

# ── Managed Redis ───────────────────────────────────────────────────────────
redis:
  - name: sentinelnexus-cache
    plan: standard
    ipAllowList: [] # Only allow internal connections
