version: 1.0
runtime: python3
build:
  commands:
    build:
      - apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev
      - pip install --no-cache-dir -r requirements.txt
run:
  runtime-version: 3.12
  command: gunicorn app.main:app --bind 0.0.0.0:$PORT --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120 --graceful-timeout 30
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: ENV
      value: production
    - name: DEBUG
      value: "false"
    - name: PORT
      value: "8080"
